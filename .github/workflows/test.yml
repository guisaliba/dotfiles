name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh test.sh omarchy/apply-power-management.sh omarchy/mx-mini-recover.sh
      - run: python3 -m py_compile lib/dotfiles_installer.py
      - run: ./test.sh --repo-only