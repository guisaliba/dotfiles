name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh test.sh omarchy/mx-mini-recover.sh
      - run: python3 -m py_compile lib/dotfiles_installer.py omarchy/install-display.py omarchy/display-plugin/layout.py omarchy/test-display.py
      - run: python3 -B omarchy/test-display.py
      - run: ./test.sh --repo-only
