general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || ~/.local/bin/omarchy-cliamp-screensaver start
    on-resume = ~/.local/bin/omarchy-cliamp-screensaver resume "$(date +%s%N)"
}

# Lock system after 10 minutes (screensaver resets idle timer, so use half + 2s margin)
listener {
    timeout = 302
    on-timeout = ~/.local/bin/omarchy-cliamp-screensaver stop; omarchy-system-lock
    on-resume = ~/.local/bin/omarchy-cliamp-screensaver stop && omarchy-system-wake
}
