# Keep the cliamp screensaver input shield invisible without making it fullscreen.
windowrule = float on, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$
windowrule = move 0 0, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$
windowrule = no_anim on, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$
windowrule = no_follow_mouse on, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$
windowrule = tag -default-opacity, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$
windowrule = opacity 0 0, match:class org.omarchy.screensaver, match:title ^Cliamp Input Shield:.*$

# Cover non-target monitors without taking focus from the cliamp input shield.
windowrule = fullscreen on, match:class org.omarchy.cliamp-blackout
windowrule = float on, match:class org.omarchy.cliamp-blackout
windowrule = no_focus on, match:class org.omarchy.cliamp-blackout
windowrule = no_anim on, match:class org.omarchy.cliamp-blackout
windowrule = tag -default-opacity, match:class org.omarchy.cliamp-blackout
windowrule = opacity 1 1, match:class org.omarchy.cliamp-blackout
windowrule = rounding 0, match:class org.omarchy.cliamp-blackout
windowrule = border_size 0, match:class org.omarchy.cliamp-blackout
